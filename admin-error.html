<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error Log — Sparkals Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #181c27;
    --card:     #1e2335;
    --border:   #2a3050;
    --text:     #e2e8f0;
    --muted:    #8892aa;
    --accent:   #4f8ef7;
    --red:      #f56565;
    --red-bg:   #2d1515;
    --amber:    #f6ad55;
    --amber-bg: #2d1f0a;
    --green:    #68d391;
    --green-bg: #0d2318;
    --font:     'DM Mono', 'Fira Code', monospace;
    --sans:     'DM Sans', system-ui, sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-icon { font-size: 20px; }
  .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .topbar-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .back-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }

  /* ── STATS ROW ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px 20px 0; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-num { font-size: 22px; font-weight: 600; font-family: var(--font); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-num.red    { color: var(--red); }
  .stat-num.amber  { color: var(--amber); }
  .stat-num.green  { color: var(--green); }
  .stat-num.accent { color: var(--accent); }

  /* ── FILTERS ── */
  .filters {
    display: flex;
    gap: 8px;
    padding: 14px 20px 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-select, .filter-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--sans);
    outline: none;
  }
  .filter-select:focus, .filter-input:focus { border-color: var(--accent); }
  .filter-input { width: 200px; }
  .filter-btn {
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .filter-btn:hover { background: var(--red); color: #fff; }
  .filter-btn.accent-btn {
    background: transparent;
    border-color: var(--accent);
    color: var(--accent);
    margin-left: auto;
  }
  .filter-btn.accent-btn:hover { background: var(--accent); color: #fff; }

  /* ── ERROR LIST ── */
  .list { padding: 0 20px 24px; display: flex; flex-direction: column; gap: 8px; }

  .error-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }
  .error-card:hover { border-color: var(--accent); }
  .error-card.status-new    { border-left: 3px solid var(--red); }
  .error-card.status-seen   { border-left: 3px solid var(--amber); }
  .error-card.status-fixed  { border-left: 3px solid var(--green); opacity: 0.6; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-message {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
    flex: 1;
    line-height: 1.5;
  }
  .status-pill {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-new   { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red); }
  .pill-seen  { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .pill-fixed { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }

  .card-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .meta-item { display: flex; align-items: center; gap: 4px; }
  .meta-icon { font-size: 12px; }

  /* ── DETAIL PANEL (slide-in) ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: flex-end;
  }
  .overlay.open { display: flex; }

  .detail-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    width: 440px;
    max-width: 100vw;
    height: 100vh;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .detail-close {
    display: flex; justify-content: space-between; align-items: center;
  }
  .close-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 4px 10px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: var(--sans);
  }
  .close-btn:hover { color: var(--text); border-color: var(--accent); }

  .detail-section { display: flex; flex-direction: column; gap: 6px; }
  .detail-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .detail-value {
    font-size: 13px; color: var(--text);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px;
    font-family: var(--font);
    word-break: break-all;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .detail-value.url { color: var(--accent); font-size: 11px; }

  .action-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .action-btn {
    flex: 1; padding: 9px 12px; border-radius: 7px;
    font-size: 12px; cursor: pointer; font-family: var(--sans); font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .action-btn.seen-btn  { border-color: var(--amber); color: var(--amber); }
  .action-btn.fixed-btn { border-color: var(--green); color: var(--green); }
  .action-btn.wa-btn    { border-color: var(--accent); color: var(--accent); }
  .action-btn:hover { opacity: 0.8; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 14px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

  /* ── ACCESS DENIED ── */
  #access-denied {
    display: none; text-align: center; padding: 80px 20px;
  }
  #access-denied h2 { color: var(--red); margin-bottom: 8px; }
  #access-denied p  { color: var(--muted); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .detail-panel { width: 100vw; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-icon">🛡️</span>
    <div>
      <div class="topbar-title">Error Log</div>
      <div class="topbar-sub">Auto-captured app errors</div>
    </div>
  </div>
  <a href="crm-dashboard.html" class="back-btn">← Dashboard</a>
</div>

<!-- ACCESS DENIED (shown if not admin) -->
<div id="access-denied">
  <h2>🔒 Admin Only</h2>
  <p>Only Sandeep can view error logs.</p>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num red" id="stat-new">—</div>
      <div class="stat-label">New errors</div>
    </div>
    <div class="stat">
      <div class="stat-num amber" id="stat-seen">—</div>
      <div class="stat-label">Seen / in progress</div>
    </div>
    <div class="stat">
      <div class="stat-num green" id="stat-fixed">—</div>
      <div class="stat-label">Fixed</div>
    </div>
    <div class="stat">
      <div class="stat-num accent" id="stat-total">—</div>
      <div class="stat-label">Total (last 30 days)</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input class="filter-input" id="search-input" placeholder="🔍  Search error message..." oninput="renderList()" />
    <select class="filter-select" id="filter-status" onchange="renderList()">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="seen">Seen</option>
      <option value="fixed">Fixed</option>
    </select>
    <select class="filter-select" id="filter-page" onchange="renderList()">
      <option value="">All pages</option>
    </select>
    <button class="filter-btn accent-btn" onclick="loadErrors()">↻ Refresh</button>
  </div>

  <!-- LIST -->
  <div class="list" id="error-list">
    <div class="loading">Loading errors...</div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="overlay" id="overlay" onclick="closePanel(event)">
  <div class="detail-panel" id="detail-panel">
    <div class="detail-close">
      <span style="font-size:14px; font-weight:600;">Error Detail</span>
      <button class="close-btn" onclick="closeDetail()">✕ Close</button>
    </div>

    <div class="detail-section">
      <div class="detail-label">Error Message</div>
      <div class="detail-value" id="d-message"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Page</div>
      <div class="detail-value" id="d-page"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Full URL</div>
      <div class="detail-value url" id="d-url"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Line / Column</div>
      <div class="detail-value" id="d-line"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Stack Trace</div>
      <div class="detail-value" id="d-stack" style="font-size:11px; max-height:140px; overflow-y:auto;"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">User</div>
      <div class="detail-value" id="d-user"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Time</div>
      <div class="detail-value" id="d-time"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Browser</div>
      <div class="detail-value" id="d-browser" style="font-size:11px;"></div>
    </div>

    <div class="action-row">
      <button class="action-btn seen-btn"  onclick="updateStatus('seen')">👁 Mark Seen</button>
      <button class="action-btn fixed-btn" onclick="updateStatus('fixed')">✅ Mark Fixed</button>
    </div>
    <div class="action-row">
      <button class="action-btn wa-btn" onclick="shareOnWhatsApp()">💬 Share via WhatsApp</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
// ── FIREBASE INIT (same config as your other pages) ─────────
const firebaseConfig = {
  apiKey: "AIzaSyBPz4aCVVBkfzBhkiuuBmLjE1J_ENtfqJQ",
  authDomain: "sparkals-tasks-app.firebaseapp.com",
  projectId: "sparkals-tasks-app",
  storageBucket: "sparkals-tasks-app.appspot.com",
  messagingSenderId: "147179987231",
  appId: "1:147179987231:web:c6ffa484f33a2ca420d02a"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db   = firebase.firestore();
const auth = firebase.auth();

// ── ADMIN CHECK ──────────────────────────────────────────────
const ADMIN_EMAILS = ["sandeepgemologist@gmail.com", "sparkals.design@gmail.com"];
let currentUser = null;

auth.onAuthStateChanged(user => {
  if (!user || !ADMIN_EMAILS.includes(user.email)) {
    document.getElementById("main-content").style.display = "none";
    document.getElementById("access-denied").style.display = "block";
    return;
  }
  currentUser = user;
  loadErrors();
});

// ── DATA ─────────────────────────────────────────────────────
let allErrors = [];
let selectedId = null;
let selectedDoc = null;

async function loadErrors() {
  document.getElementById("error-list").innerHTML = '<div class="loading">Loading...</div>';
  try {
    // Last 30 days
    const since = new Date();
    since.setDate(since.getDate() - 30);

    const snap = await db.collection("errorLogs")
      .where("timestamp", ">=", since.toISOString())
      .orderBy("timestamp", "desc")
      .limit(200)
      .get();

    allErrors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateStats();
    populatePageFilter();
    renderList();
  } catch (e) {
    document.getElementById("error-list").innerHTML =
      '<div class="loading" style="color:#f56565;">Failed to load errors: ' + e.message + '</div>';
  }
}

function updateStats() {
  const counts = { new: 0, seen: 0, fixed: 0 };
  allErrors.forEach(e => { if (counts[e.status] !== undefined) counts[e.status]++; });
  document.getElementById("stat-new").textContent   = counts.new;
  document.getElementById("stat-seen").textContent  = counts.seen;
  document.getElementById("stat-fixed").textContent = counts.fixed;
  document.getElementById("stat-total").textContent = allErrors.length;
}

function populatePageFilter() {
  const pages = [...new Set(allErrors.map(e => e.page))].sort();
  const sel = document.getElementById("filter-page");
  const current = sel.value;
  sel.innerHTML = '<option value="">All pages</option>';
  pages.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    if (p === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderList() {
  const search = document.getElementById("search-input").value.toLowerCase();
  const statusF = document.getElementById("filter-status").value;
  const pageF   = document.getElementById("filter-page").value;

  let filtered = allErrors.filter(e => {
    if (statusF && e.status !== statusF) return false;
    if (pageF   && e.page   !== pageF)   return false;
    if (search  && !(e.message || "").toLowerCase().includes(search)) return false;
    return true;
  });

  const list = document.getElementById("error-list");
  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>No errors match your filters.</div>';
    return;
  }

  list.innerHTML = filtered.map(e => {
    const time = e.timestamp ? new Date(e.timestamp).toLocaleString("en-IN", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
    }) : "—";
    const msg = (e.message || "").slice(0, 120);
    const pillClass = "pill-" + (e.status || "new");
    const cardClass = "status-" + (e.status || "new");
    return `
      <div class="error-card ${cardClass}" onclick="openDetail('${e.id}')">
        <div class="card-top">
          <div class="card-message">${escHtml(msg)}</div>
          <span class="status-pill ${pillClass}">${(e.status || "new").toUpperCase()}</span>
        </div>
        <div class="card-meta">
          <span class="meta-item"><span class="meta-icon">📄</span>${escHtml(e.page || "—")}</span>
          <span class="meta-item"><span class="meta-icon">👤</span>${escHtml(e.userName || "—")} (${escHtml(e.userRole || "—")})</span>
          <span class="meta-item"><span class="meta-icon">🕐</span>${time}</span>
          <span class="meta-item"><span class="meta-icon">📍</span>Line ${e.line || 0}</span>
        </div>
      </div>`;
  }).join("");
}

// ── DETAIL PANEL ─────────────────────────────────────────────
function openDetail(id) {
  const e = allErrors.find(x => x.id === id);
  if (!e) return;
  selectedId  = id;
  selectedDoc = e;

  const time = e.timestamp ? new Date(e.timestamp).toLocaleString("en-IN", {
    weekday: "short", day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  }) : "—";

  document.getElementById("d-message").textContent = e.message  || "—";
  document.getElementById("d-page").textContent    = e.page     || "—";
  document.getElementById("d-url").textContent     = e.fullUrl  || "—";
  document.getElementById("d-line").textContent    = "Line " + (e.line || 0) + ", Column " + (e.column || 0);
  document.getElementById("d-stack").textContent   = e.stack    || "No stack trace available";
  document.getElementById("d-user").textContent    = (e.userName || "—") + "  ·  " + (e.userRole || "—") + "  ·  " + (e.userEmail || "—");
  document.getElementById("d-time").textContent    = time;
  document.getElementById("d-browser").textContent = e.browser  || "—";

  document.getElementById("overlay").classList.add("open");

  // Auto-mark as seen if it was new
  if (e.status === "new") updateStatus("seen", true);
}

function closeDetail() {
  document.getElementById("overlay").classList.remove("open");
  selectedId = null; selectedDoc = null;
}

function closePanel(e) {
  if (e.target === document.getElementById("overlay")) closeDetail();
}

async function updateStatus(newStatus, silent = false) {
  if (!selectedId) return;
  try {
    await db.collection("errorLogs").doc(selectedId).update({
      status: newStatus,
      resolvedAt: newStatus === "fixed" ? new Date().toISOString() : null,
      resolvedBy: newStatus === "fixed" ? (currentUser ? currentUser.email : "admin") : null
    });
    // Update local data
    const idx = allErrors.findIndex(x => x.id === selectedId);
    if (idx !== -1) {
      allErrors[idx].status = newStatus;
      if (selectedDoc) selectedDoc.status = newStatus;
    }
    updateStats();
    renderList();
    if (!silent) {
      closeDetail();
    }
  } catch (e) {
    alert("Could not update status: " + e.message);
  }
}

function shareOnWhatsApp() {
  if (!selectedDoc) return;
  const e = selectedDoc;
  const msg = [
    "🛠️ *Error to Fix*",
    "",
    "📄 Page: " + (e.page || "—"),
    "❌ Error: " + (e.message || "—").slice(0, 150),
    "📍 Line: " + (e.line || 0),
    "👤 User: " + (e.userName || "—") + " (" + (e.userRole || "—") + ")",
    "🕐 Time: " + (e.timestamp ? new Date(e.timestamp).toLocaleString("en-IN") : "—"),
    "",
    "Stack: " + (e.stack || "—").slice(0, 200)
  ].join("\n");
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}

function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
